version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: quizapp-postgres
    environment:
      POSTGRES_USER: quizapp
      POSTGRES_PASSWORD: quizapp_dev_password
      POSTGRES_DB: quizapp
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: quizapp-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
